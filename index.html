    <script>
      (function() {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return currentFetch; },
              set: function(fn) { currentFetch = fn; },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() { return currentFetch; },
                set: function(fn) { currentFetch = fn; },
                configurable: true,
                enumerable: true
              });
            } catch (e2) {}
          }
        } catch (e) {}

        // Suppress benign iframe/environment script error if thrown externally
        window.addEventListener('error', function(event) {
          if (!event || !event.message) {
            event?.preventDefault?.();
            return;
          }
          if (
            event.message.includes('fetch') ||
            event.message.includes('getter') ||
            event.message.includes('ResizeObserver') ||
            event.message.includes('AudioContext')
          ) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);

        // Catch unhandled promise rejections to prevent blank uncaught crashes
        window.addEventListener('unhandledrejection', function(event) {
          console.warn('Unhandled promise rejection safely handled:', event.reason);
          event.preventDefault();
        });
      })();
    </script>
